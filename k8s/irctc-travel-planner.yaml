apiVersion: v1
kind: Namespace
metadata:
  name: irctc-travel-planner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: irctc-travel-planner
  namespace: irctc-travel-planner
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: irctc-travel-planner-config
  namespace: irctc-travel-planner
data:
  NEXT_PUBLIC_APP_URL: https://irctc-travel-planner.k8s.harish2k01.xyz
  EMAIL_FROM: IRCTC Travel Planner <noreply@example.com>
  PNR_PROVIDER_URL: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: irctc-travel-planner-postgres-data
  namespace: irctc-travel-planner
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: irctc-travel-planner-postgres-backups
  namespace: irctc-travel-planner
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: irctc-travel-planner-postgres
  namespace: irctc-travel-planner
spec:
  serviceName: irctc-travel-planner-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: irctc-travel-planner
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: irctc-travel-planner
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: irctc-travel-planner
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: irctc-travel-planner-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: [pg_isready, -U, irctc, -d, irctc]
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec:
              command: [pg_isready, -U, irctc, -d, irctc]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, irctc, -d, irctc]
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: irctc-travel-planner-postgres-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: irctc-travel-planner-postgres
  namespace: irctc-travel-planner
spec:
  selector:
    app.kubernetes.io/name: irctc-travel-planner
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: irctc-travel-planner-web
  namespace: irctc-travel-planner
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: irctc-travel-planner
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: irctc-travel-planner
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: irctc-travel-planner
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/harish2k01/irctc-travel-planner:0.14.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: irctc-travel-planner-secrets
            - configMapRef:
                name: irctc-travel-planner-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: irctc-travel-planner-web
  namespace: irctc-travel-planner
spec:
  selector:
    app.kubernetes.io/name: irctc-travel-planner
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: irctc-travel-planner-web
  namespace: irctc-travel-planner
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: irctc-travel-planner
      app.kubernetes.io/component: web
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: irctc-travel-planner-web
  namespace: irctc-travel-planner
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: irctc-travel-planner-web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: irctc-travel-planner-db-migrate
  namespace: irctc-travel-planner
spec:
  schedule: "0 0 31 2 *"
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: irctc-travel-planner
            app.kubernetes.io/component: worker
        spec:
          serviceAccountName: irctc-travel-planner
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: migrate
              image: ghcr.io/harish2k01/irctc-travel-planner:0.14.0
              imagePullPolicy: Always
              command: [npm, run, prisma:migrate:deploy]
              envFrom:
                - secretRef:
                    name: irctc-travel-planner-secrets
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: irctc-travel-planner-reminders
  namespace: irctc-travel-planner
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: irctc-travel-planner
            app.kubernetes.io/component: worker
        spec:
          serviceAccountName: irctc-travel-planner
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trigger
              image: alpine:3.23
              command: [sh, -c, 'wget -qO- --header="Authorization: Bearer ${CRON_SECRET}" --post-data="" http://irctc-travel-planner-web/api/internal/reminders/process']
              envFrom:
                - secretRef:
                    name: irctc-travel-planner-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: irctc-travel-planner-pnr-sync
  namespace: irctc-travel-planner
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: irctc-travel-planner
            app.kubernetes.io/component: worker
        spec:
          serviceAccountName: irctc-travel-planner
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trigger
              image: alpine:3.23
              command: [sh, -c, 'wget -qO- --header="Authorization: Bearer ${CRON_SECRET}" --post-data="" http://irctc-travel-planner-web/api/internal/pnr-sync']
              envFrom:
                - secretRef:
                    name: irctc-travel-planner-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: irctc-travel-planner-postgres-backup
  namespace: irctc-travel-planner
spec:
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: irctc-travel-planner
            app.kubernetes.io/component: worker
        spec:
          serviceAccountName: irctc-travel-planner
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:18-alpine
              envFrom:
                - secretRef:
                    name: irctc-travel-planner-secrets
              command: [sh, -c, 'set -eu; export PGPASSWORD="$POSTGRES_PASSWORD"; stamp=$(date +%Y%m%d-%H%M%S); target="/backups/irctc-${stamp}.dump"; temporary="${target}.tmp"; trap "rm -f \"$temporary\"" EXIT; pg_dump -h irctc-travel-planner-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f "$temporary"; mv "$temporary" "$target"; trap - EXIT; find /backups -type f -name "*.tmp" -delete; find /backups -type f -name "*.dump" -size 0 -delete; find /backups -type f -name "*.dump" -mtime +14 -delete']
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: irctc-travel-planner-postgres-backups
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: irctc-travel-planner-default-deny
  namespace: irctc-travel-planner
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: irctc-travel-planner-web
  namespace: irctc-travel-planner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: irctc-travel-planner
      app.kubernetes.io/component: web
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 465
        - protocol: TCP
          port: 587
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: irctc-travel-planner-workers
  namespace: irctc-travel-planner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: irctc-travel-planner
      app.kubernetes.io/component: worker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: 3000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: irctc-travel-planner-database
  namespace: irctc-travel-planner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: irctc-travel-planner
      app.kubernetes.io/component: database
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [web, worker]
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: irctc-travel-planner-web
  namespace: irctc-travel-planner
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - irctc-travel-planner.k8s.harish2k01.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: irctc-travel-planner-web
          port: 80
