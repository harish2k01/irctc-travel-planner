services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: railwatch
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: railwatch
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U railwatch -d railwatch]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    command: [npm, run, prisma:migrate:deploy]
    environment: &backend-environment
      DATABASE_URL: postgresql://railwatch:change-me@postgres:5432/railwatch?schema=public
      APP_URL: http://localhost:3000
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      RATE_LIMIT_SALT: local-development-salt
      CRON_SECRET: local-development-worker-secret
      RAILWATCH_SERVICE: backend
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    build: .
    environment: *backend-environment
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build: .
    environment:
      RAILWATCH_SERVICE: frontend
      BACKEND_URL: http://backend:3001
      APP_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres-data:
