services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: irctc
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: irctc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U irctc -d irctc]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    command: [npm, run, prisma:migrate:deploy]
    environment: &app-environment
      DATABASE_URL: postgresql://irctc:change-me@postgres:5432/irctc?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      RATE_LIMIT_SALT: local-development-salt
      CRON_SECRET: local-development-worker-secret
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment: *app-environment
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    environment: *app-environment
    command:
      - node
      - --input-type=module
      - -e
      - "for (;;) { try { const response = await fetch('http://app:3000/api/internal/railplan/process', { method: 'POST', headers: { Authorization: 'Bearer ' + process.env.CRON_SECRET }, signal: AbortSignal.timeout(270000) }); if (!response.ok) console.error('Worker status', response.status); } catch { console.error('Worker unavailable'); } await new Promise(resolve => setTimeout(resolve, 60000)); }"
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
